name: dns-cd
on:
  # Manual only, and deliberately not reachable from any scheduled or destroy workflow: this state
  # owns the mesazon.space zone, and destroying it takes every hostname under the domain offline.
  workflow_dispatch:
jobs:
  dns-deploy-dev-plan:
    uses: ./.github/workflows/job-tf-plan.yml
    secrets: inherit # Inherit secrets from the parent workflow
    with:
      project-id: "33eee19d-9b81-4846-b24f-c39bf70fe1f5"
      working-directory: "terraform/dev/dns"
      module: "dns-dev"
      docker-image-name: "unused"
      docker-image-tag: "unused"

  dns-deploy-dev-apply:
    needs: [ "dns-deploy-dev-plan" ]
    uses: ./.github/workflows/job-tf-apply.yml
    secrets: inherit # Inherit secrets from the parent workflow
    with:
      project-id: "33eee19d-9b81-4846-b24f-c39bf70fe1f5"
      working-directory: "terraform/dev/dns"
      module: "dns-dev"
      docker-image-name: "unused"
      docker-image-tag: "unused"
      environment: "dev"
