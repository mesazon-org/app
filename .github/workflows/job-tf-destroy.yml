name: tf-destroy
on:
  workflow_call:
    inputs:
      project-id:
        description: "Project ID (The environment you want to create resources in)"
        type: string
        required: true
      working-directory:
        description: "Working directory"
        type: string
        required: true
      module:
        description: "Usually module name + environment (mesazon-shared-dev, etc)"
        type: string
        required: true
      environment:
        description: "Deployment environment name"
        type: string
        required: true
      docker-image-name:
        description: "Docker image name"
        type: string
        required: true
      docker-image-tag:
        description: "Docker image tag"
        type: string
        required: true
      release-domains:
        description: "Drop custom domains from the app spec before deleting it, so DigitalOcean frees the hostname immediately"
        type: boolean
        required: false
        default: false
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  SPACES_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  SPACES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_do_token: ${{ secrets.DO_API_KEY }}
  TF_VAR_project_id: ${{ inputs.project-id }}
  TF_VAR_email_sender_password: ${{ secrets.EMAIL_SENDER_PASSWORD }}
  TF_VAR_twilio_client_account_sid: ${{ secrets.TWILIO_CLIENT_ACCOUNT_SID }}
  TF_VAR_twilio_client_auth_token: ${{ secrets.TWILIO_CLIENT_AUTH_TOKEN }}
  TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
  TF_VAR_image_name: ${{ inputs.docker-image-name }}
  TF_VAR_image_tag: ${{ inputs.docker-image-tag }}
jobs:
  build:
    environment: ${{ github.event_name == 'pull_request' && 'dev_pr' || inputs.environment || 'prod' }}
    name: tf-destroy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.DO_SPACES_BUCKET }}" \
            -backend-config="key=${{ inputs.module }}-tf-state/terraform.tfstate" \
            -backend-config="endpoints={s3=\"https://${{ secrets.DO_SPACES_REGION }}.digitaloceanspaces.com\"}"
      - name: Release custom domains
        if: inputs.release-domains
        run: |
          set -euo pipefail
          if ! terraform state list | grep -q 'digitalocean_app'; then
            echo "No app in state; nothing to release."
            exit 0
          fi
          image_tag="$(terraform output -raw image_tag 2>/dev/null || true)"
          if [ -z "$image_tag" ]; then
            echo "No image_tag output in state; skipping release, the domain may be held for up to 24h."
            exit 0
          fi
          echo "Removing the custom domain from the live app before deleting it."
          terraform apply -auto-approve -input=false \
            -var="custom_domain_enabled=false" \
            -var="image_tag=$image_tag"
      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false
