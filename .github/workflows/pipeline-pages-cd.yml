name: pages-cd

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/pipeline-pages-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Requires Settings -> Pages -> Source = "GitHub Actions" to be set once, by hand.
      # The action's `enablement: true` input cannot do it for us: it needs a PAT or App
      # token, not the default GITHUB_TOKEN.
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./pages
          destination: ./_site
      # v4 stopped bundling hidden files; the Jekyll output has none, so the
      # default include-hidden-files: false is fine.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
