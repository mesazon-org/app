name: gateway-destroy-cron
on:
  workflow_dispatch:
  schedule:
    # 02:00 CET (UTC+1) on Monday, Wednesday, Friday -- fires at 03:00 local during CEST, a known 1h
    # DST drift, GitHub Actions cron has no timezone support. Three a week, not twice a day: every
    # destroy costs a fresh TLS certificate on the next deploy, and Let's Encrypt allows only 5 per
    # exact name set per 7 days.
    - cron: '0 1 * * 1,3,5'
jobs:
  gateway-destroy-dev:
    uses: ./.github/workflows/job-tf-destroy.yml
    secrets: inherit # Inherit secrets from the parent workflow
    with:
      project-id: "33eee19d-9b81-4846-b24f-c39bf70fe1f5"
      working-directory: "terraform/dev/gateway"
      module: "gateway-dev"
      environment: "dev"
      docker-image-name: "gateway-core"
      docker-image-tag: "unused"
      release-domains: true
