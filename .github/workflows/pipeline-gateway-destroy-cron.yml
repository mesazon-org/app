name: gateway-destroy-cron
on:
  workflow_dispatch:
  schedule:
    # 01:00 and 13:00 CET (UTC+1, standard time). During CEST (UTC+2, roughly
    # late Mar-late Oct) these fire at 02:00/14:00 local -- known 1h DST drift,
    # GitHub Actions cron has no timezone support.
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
jobs:
  gateway-destroy-dev:
    uses: ./.github/workflows/job-tf-destroy.yml
    secrets: inherit # Inherit secrets from the parent workflow
    with:
      project-id: "33eee19d-9b81-4846-b24f-c39bf70fe1f5"
      working-directory: "terraform/dev/gateway"
      module: "gateway-dev"
      environment: "dev"
      docker-image-name: "gateway-core"
      docker-image-tag: "unused"
